name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: octie

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: octie/package-lock.json
      - run: npm ci
      # web-ui is its own package; its build (octie serve) needs these too
      - run: npm ci
        working-directory: octie/web-ui
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:smoke
      - run: npm test
