name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: octie

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: octie/package-lock.json
      - run: npm ci
      # web-ui is its own package; its build (octie serve) needs these too
      - run: npm ci
        working-directory: octie/web-ui
      - run: npm run typecheck
      - run: npm run build
      # Committed dist must stay in sync with source: GitHub-direct installs
      # ship only git-tracked files. Fail when the fresh build drifts.
      - run: git diff --exit-code -- octie/dist
        working-directory: ${{ github.workspace }}
      - run: npm run test:smoke
      - run: npm test
